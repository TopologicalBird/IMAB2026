<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>IMAB2026</title>
        <style>
            body {
              margin: 0;
              font-family:Arial, Helvetica, sans-serif;
              padding-left: 6vw;      /* 左余白 */
              padding-right: 6vw;     /* 右余白 */
              padding-bottom: 50px;
            }
          
            .hero {
              position: relative;
              height: 100vh;

              /* 背景画像 */
              background-image: url("./img/IMG_0466.jpg"); /* ← 実際の画像パス */
              background-size: cover;
              background-position: center;
              background-repeat: no-repeat;

              /* body padding 打ち消し（必要なら） */
              margin-left: -6vw;
              margin-right: -6vw;
              width: calc(100% + 12vw);
              overflow: hidden;
            }

            /* 暗くするオーバーレイ */
            .hero-overlay {
              position: absolute;
              inset: 0;
              background: rgba(0, 0, 0, 0.1);
              z-index: 0;
            }
            /* 文字の「枠」＝画像と同じ大きさ */
            .hero-content {
              position: relative;
              z-index: 1;

              height: 100%;                  /* ← hero と完全一致 */
              display: flex;
              flex-direction: column;
              justify-content: space-between;

              padding: 15vh 6vw;
              color: white;
              text-align: center;
              box-sizing: border-box;
            }
            

            /* 文字 */
            .hero-text {
              position: relative;
              z-index: 1;

              height: 100%;
              display: flex;
              flex-direction: column;
              justify-content: space-between;

              padding: 5vh 6vw;

              color: white;
              text-align: center;
            }

            .hero h1,
            .hero h2 {
              font-family: 'Orbitron', sans-serif;
            }
          
            .hero-text p {
              margin-top: 1rem;
              font-size: clamp(1rem, 3vw, 1.5rem);
            }
            .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 90vw;
            margin: 0 auto;
            }

            .info-btn {
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, #00bfff, #7b00ff);
            border-radius: 10px;

            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.85rem, 3.5vw, 1.1rem);
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            text-align: center;

            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            }
            .map-container {
              position: relative;
              padding-top: 50%; 
            }

            .map-container iframe {
              position: absolute;
              top: 0;
              left: 0;
              width: 80%;
              height: 100%;
            }
            footer {
              position: fixed;
              bottom: 0;
              left: 0;
              width: 100%;
              background: darkblue;
              color: white;
              text-align: center;
              padding: 8px;
            }
        </style>
    </head>
    <body>
      <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
        <h2 style="font-family: 'Orbitron', sans-serif; color: darkblue;font-weight: bold;">IMAB2026</h2>
        <p>The Second International Workshop on Mathematics and AI for Biomedicine <br>
          November 30th, 2026<br>
          The University of Tokyo & Online (Hybrid event)
        </p>
        <div class="info-grid">
          <a class="info-btn" href="index.html" target="_blank">
            Back to Home
          </a>
        </div>
        <h2 style="font-family: 'Orbitron', sans-serif; color: darkblue;font-weight: bold;">Access</h2>
        <div class="map-container">
          <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3239.507437789675!2d139.76035687508863!3d35.713736928188794!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60188c2ffa206ea3%3A0x30e407498313ba95!2z5p2x5Lqs5aSn5a2m!5e0!3m2!1sja!2sjp!4v1766832690565!5m2!1sja!2sjp"
            width="300"
            height="200"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
        <p>
          The University of Tokyo, Hongo Campus
        </p>
        
          <footer>
            IMAB2026
          </footer>

    </body>
</html>
